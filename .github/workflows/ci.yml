name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Verify Repository Structure
        run: |
          echo "Verifying mandatory files..."
          test -f architecture.md
          test -f AGENTS.md
          test -f AGENTS_AND_SKILLS.md
          test -f skills/atlas.js
          test -f skills/athena.js
          test -f skills/hermes.js
          test -f .env.example
          test -f .gitignore
          test -f tests/skills.test.js
          echo "Structure verification passed!"
