name: 'ARGUS'
description: 'Autonomous AI PR Reviewer running Atlas, Athena, and Hermes evaluation stages using Google Gemini (default) or any OpenAI-compatible cloud provider.'
author: 'SahooShuvranshu'
inputs:
  github-token:
    description: 'GitHub token for posting comments and retrieving PR info'
    required: true
    default: ${{ github.token }}
  api-key:
    description: 'Universal API Key for Google Gemini (default) or OpenAI-compatible provider (NVIDIA, OpenRouter, Groq, OpenAI)'
    required: false
  gemini-api-key:
    description: 'Google Gemini API key'
    required: false
  base-url:
    description: 'Base URL endpoint for OpenAI-compatible providers (optional)'
    required: false
  model:
    description: 'AI Model name (default: gemini-2.0-flash)'
    required: false
    default: 'gemini-2.0-flash'
  nvidia-api-key:
    description: 'NVIDIA API key'
    required: false
runs:
  using: 'node20'
  main: 'index.js'
branding:
  icon: 'eye'
  color: 'purple'
