name: 'Argus AI Code Reviewer'
description: 'Autonomous 3-stage AI code reviewer executing visual topology, architectural compliance, and technical debt scans.'
author: 'SahooShuvranshu'
inputs:
  github-token:
    description: 'GitHub token for posting comments and retrieving PR info'
    required: false
    default: '${{ github.token }}'
  api-key:
    description: 'Universal API Key for Google Gemini (default) or OpenAI-compatible providers'
    required: false
  gemini-api-key:
    description: 'Google Gemini API key'
    required: false
  openai-api-key:
    description: 'OpenAI API key'
    required: false
  nvidia-api-key:
    description: 'NVIDIA NIM API key'
    required: false
  openrouter-api-key:
    description: 'OpenRouter API key'
    required: false
  groq-api-key:
    description: 'Groq Cloud API key'
    required: false
  base-url:
    description: 'Base URL endpoint for OpenAI-compatible providers'
    required: false
  model:
    description: 'AI model name (default: gemini-2.0-flash)'
    required: false
    default: 'gemini-2.0-flash'
runs:
  using: 'composite'
  steps:
    - name: Install Action Dependencies
      shell: bash
      run: cd "${{ github.action_path }}" && npm ci --omit=dev

    - name: Run ARGUS AI Reviewer
      shell: bash
      run: node "${{ github.action_path }}/index.js"
      env:
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_API-KEY: ${{ inputs.api-key }}
        INPUT_GEMINI-API-KEY: ${{ inputs.gemini-api-key }}
        INPUT_OPENAI-API-KEY: ${{ inputs.openai-api-key }}
        INPUT_NVIDIA-API-KEY: ${{ inputs.nvidia-api-key }}
        INPUT_OPENROUTER-API-KEY: ${{ inputs.openrouter-api-key }}
        INPUT_GROQ-API-KEY: ${{ inputs.groq-api-key }}
        INPUT_BASE-URL: ${{ inputs.base-url }}
        INPUT_MODEL: ${{ inputs.model }}
branding:
  icon: 'eye'
  color: 'purple'
